name: Council Consult Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
    paths:
      - "schema/**"
      - "SCHEMA_SPEC.md"
      - "docs/GRAPH_CONVENTIONS.md"
      - "entities/**"
      - "relationships/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flag-schema-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      schema_change: ${{ steps.detect.outputs.schema_change }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect schema-level and meta (workflow) changes
        id: detect
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(schema/|SCHEMA_SPEC\.md|docs/GRAPH_CONVENTIONS\.md)'; then
            echo "schema_change=true" >> "$GITHUB_OUTPUT"
          else
            echo "schema_change=false" >> "$GITHUB_OUTPUT"
          fi
          # Meta-protection: changes to the governance workflows themselves
          # also require a Council Consult record — see AGENTS.md.
          if echo "$CHANGED" | grep -qE '^\.github/workflows/(wf-council|wf-audit)\.yaml$'; then
            echo "meta_change=true" >> "$GITHUB_OUTPUT"
          else
            echo "meta_change=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Label PR as needing council review
        if: steps.detect.outputs.schema_change == 'true' || steps.detect.outputs.meta_change == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ["needs-council-review"],
              });
            } catch (err) {
              core.warning(
                `Could not apply 'needs-council-review' label (it may not exist in the repo yet — see .github/labels.yml for the canonical label set and set up a labels-sync action): ${err.message}`
              );
            }

      - name: Check for Council Consult record
        if: steps.detect.outputs.schema_change == 'true' || steps.detect.outputs.meta_change == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const hasRecord = (text) =>
              !!text &&
              text.includes("### Council Consult:") &&
              /\*\*Synthesis:\*\*/.test(text);

            let found = hasRecord(pr.body || "");

            if (!found) {
              // Accept the record from PR comments too, not body-only.
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                }
              );
              found = comments.some((c) => hasRecord(c.body || ""));
            }

            if (!found) {
              core.setFailed(
                "This PR touches schema/conventions and/or the governance " +
                "workflow files themselves (wf-council.yaml / wf-audit.yaml) " +
                "but has no complete Council Consult record. Run the " +
                "council-consult skill (skills/council-consult.skill.md) and " +
                "paste its output — including a '**Synthesis:**' line — into " +
                "the PR description or as a PR comment before merging."
              );
            }

  request-copilot-review:
    if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Request GitHub Copilot code review
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers: ["copilot-pull-request-reviewer[bot]"],
              });
              core.notice("Requested a GitHub Copilot code review on this pull request.");
            } catch (err) {
              core.warning(
                "Could not auto-request Copilot review (" + err.message + "). " +
                "Request it manually from the Reviewers panel, or via the " +
                "request_copilot_review tool if using an agent."
              );
            }

  post-briefing:
    needs: [flag-schema-changes, request-copilot-review]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Post Graph Substrate Briefing
        uses: actions/github-script@v7
        with:
          script: |
            // Placeholder for agents/briefing.agent.md integration.
            // Replace this step with a call to the briefing agent runtime
            // once one is wired up; until then this documents the contract
            // and expected output template defined in
            // agents/briefing.agent.md. A future revision of that template
            // should also report the outcome of the request-copilot-review
            // job above (pass/flagged/pending).
            core.notice(
              "Briefing agent hook: see agents/briefing.agent.md for the " +
              "expected output template this step should post as a PR comment."
            );
